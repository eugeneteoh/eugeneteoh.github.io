{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>
    <ul>
        {{ range .Pages }}
            {{ $href := .Permalink }}
            {{ with .Params.external_url }}
                {{ $href = . }}
            {{ end }}
            <li><a href="{{ $href }}">{{ .Date.Format "2006-01-02" }} | {{ .Title }}</a></li>
        {{ end }}
    </ul>
</div>
{{ end }}
